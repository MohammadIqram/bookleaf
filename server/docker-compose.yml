version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: bookleaf_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: bookleaf
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: bookleaf_api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/bookleaf?schema=public
      JWT_SECRET: bookleaf_production_secret_key_32_characters_minimum
      JWT_EXPIRES_IN: 7d
      CORS_ORIGIN: "http://localhost:3000,https://bookleaf-portal.vercel.app"
      LLM_PROVIDER: anthropic
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: claude-3-haiku-20240307
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: gpt-4o-mini
    ports:
      - "5000:5000"

volumes:
  postgres_data:
